openapi: 3.0.3
info:
  title: Catalogue Publication
  version: 1.0.0
paths:
  /catalogue:
    post:
      operationId: publishCatalogue
      tags: [Catalogue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationRequest"
      responses:
        "200":
          description: Publication acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationAck"
components:
  schemas:
    PublicationItem:
      type: object
      additionalProperties: false
      required: [sku, label, quantity]
      properties:
        sku: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        quantity: { type: integer, minimum: 0 }
    PublicationRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicationItem"
    PublicationAck:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted: { type: integer, minimum: 0 }
